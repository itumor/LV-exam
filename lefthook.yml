# lefthook config — see https://lefthook.dev/
#
# Runs commitlint on every commit message and re-runs unit tests pre-push.
# Install lefthook locally with `npx lefthook install` (added as devDep in
# package.json by T-003).

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    unit-tests:
      run: npm run test:unit
    contract-tests:
      run: npm run test:contracts
