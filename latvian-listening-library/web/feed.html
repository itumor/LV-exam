<!doctype html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Latvian Listening Feed</title>
    <meta
      name="description"
      content="TikTok-style vertical scroll feed of Latvian listening clips with a one-question micro-quiz after each clip. Works offline."
    />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- T-061 PWA wiring -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#082f49" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Klausīšanās" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <style>
      :root {
        --feed-bg: #060810;
        --feed-ink: #f7faff;
        --feed-muted: rgba(247, 250, 255, 0.72);
        --feed-line: rgba(255, 255, 255, 0.16);
        --feed-panel: rgba(8, 13, 22, 0.78);
        --feed-correct: #18b981;
        --feed-wrong: #ff4f87;
        --feed-gold: #ffd166;
        --feed-accent: #5b8def;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--feed-bg);
        color: var(--feed-ink);
        font-family: ui-rounded, "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      .feed {
        position: fixed;
        inset: 0;
        height: 100dvh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        background:
          radial-gradient(circle at 18% 12%, rgba(24, 185, 129, 0.18), transparent 30rem),
          radial-gradient(circle at 82% 28%, rgba(91, 141, 239, 0.2), transparent 28rem),
          var(--feed-bg);
      }

      .feed::-webkit-scrollbar {
        display: none;
      }

      .feed-card {
        position: relative;
        height: 100dvh;
        width: 100vw;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px 24px 96px;
      }

      .feed-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.78) 78%);
        pointer-events: none;
      }

      .feed-card__inner {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 640px;
        margin: 0 auto;
        width: 100%;
        z-index: 1;
      }

      .feed-card__meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--feed-muted);
      }

      .feed-card__chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--feed-line);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
        font-size: 11px;
      }

      .feed-card__title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.3;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
      }

      .feed-card__transcript {
        background: var(--feed-panel);
        border: 1px solid var(--feed-line);
        border-radius: 18px;
        padding: 14px 16px;
        font-size: 15px;
        line-height: 1.5;
        backdrop-filter: blur(8px);
        max-height: 28dvh;
        overflow-y: auto;
      }

      .feed-card__translation {
        font-size: 13px;
        color: var(--feed-muted);
        margin-top: 8px;
      }

      .feed-card__controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .feed-card__play {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: var(--feed-ink);
        color: var(--feed-bg);
        font-size: 22px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.12s ease;
      }

      .feed-card__play:active {
        transform: scale(0.94);
      }

      .feed-card__play[data-state="playing"] {
        background: var(--feed-accent);
        color: #fff;
      }

      .feed-card__hint {
        font-size: 13px;
        color: var(--feed-muted);
      }

      .feed-quiz {
        position: relative;
        z-index: 2;
        background: var(--feed-panel);
        border: 1px solid var(--feed-line);
        border-radius: 22px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        backdrop-filter: blur(10px);
      }

      .feed-quiz[hidden] {
        display: none;
      }

      .feed-quiz__prompt {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      .feed-quiz__prompt-lv {
        margin: -4px 0 0;
        font-size: 13px;
        color: var(--feed-muted);
      }

      .feed-quiz__options {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .feed-quiz__btn {
        width: 100%;
        text-align: left;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--feed-line);
        color: var(--feed-ink);
        padding: 12px 14px;
        border-radius: 14px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.12s ease, transform 0.12s ease;
      }

      .feed-quiz__btn:hover,
      .feed-quiz__btn:focus-visible {
        background: rgba(255, 255, 255, 0.12);
      }

      .feed-quiz__btn[data-result="correct"] {
        background: rgba(24, 185, 129, 0.32);
        border-color: var(--feed-correct);
      }

      .feed-quiz__btn[data-result="wrong"] {
        background: rgba(255, 79, 135, 0.28);
        border-color: var(--feed-wrong);
      }

      .feed-quiz__btn[data-result="reveal"] {
        background: rgba(91, 141, 239, 0.22);
        border-color: var(--feed-accent);
      }

      .feed-quiz__btn[disabled] {
        cursor: default;
      }

      .feed-quiz__result {
        font-size: 14px;
        font-weight: 600;
      }

      .feed-quiz__result[data-state="correct"] {
        color: var(--feed-correct);
      }

      .feed-quiz__result[data-state="wrong"] {
        color: var(--feed-wrong);
      }

      .feed-card__progress {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        z-index: 3;
      }

      .feed-card__progress-bar {
        height: 100%;
        width: 0%;
        background: var(--feed-accent);
        transition: width 0.18s linear;
      }

      .feed-status {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--feed-line);
        backdrop-filter: blur(8px);
        font-size: 12px;
        color: var(--feed-muted);
        z-index: 10;
        display: none;
      }

      .feed-status[data-visible="true"] {
        display: block;
      }

      .feed-empty,
      .feed-error {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        gap: 18px;
        text-align: center;
      }

      .feed-error button {
        background: var(--feed-accent);
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }

      .feed-loader {
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: var(--feed-muted);
        letter-spacing: 0.04em;
      }

      .feed-loader::after {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-left: 10px;
        background: var(--feed-accent);
        animation: feed-pulse 0.8s infinite ease-in-out alternate;
      }

      @keyframes feed-pulse {
        from {
          opacity: 0.3;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      .feed-xp {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--feed-panel);
        border: 1px solid var(--feed-line);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        backdrop-filter: blur(8px);
        z-index: 10;
      }

      /* T-061 offline pill + install banner */
      .feed-offline-pill {
        position: fixed;
        top: 18px;
        right: 18px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 79, 135, 0.22);
        border: 1px solid var(--feed-wrong);
        color: var(--feed-ink);
        font-size: 12px;
        font-weight: 600;
        z-index: 20;
        display: none;
      }
      .feed-offline-pill[data-visible="true"] { display: inline-flex; gap: 6px; align-items: center; }
      .feed-offline-pill::before {
        content: "";
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--feed-wrong);
      }

      .pwa-install-banner {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 80px;
        z-index: 30;
        background: var(--feed-panel);
        border: 1px solid var(--feed-line);
        color: var(--feed-ink);
        padding: 12px 14px;
        border-radius: 16px;
        backdrop-filter: blur(12px);
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        font-size: 13px;
      }
      .pwa-install-banner[hidden] { display: none !important; }
      .pwa-install-banner__text { display: flex; flex-direction: column; gap: 2px; flex: 1 1 200px; }
      .pwa-install-banner__text strong { font-size: 14px; }
      .pwa-install-banner__text span { color: var(--feed-muted); }
      .pwa-install-banner__actions { display: flex; gap: 8px; }
      .pwa-install-banner button {
        border: none;
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        font-size: 12px;
      }
      .pwa-install-banner button#pwa-install-accept { background: var(--feed-accent); color: #fff; }
      .pwa-install-banner button#pwa-install-dismiss {
        background: transparent;
        color: var(--feed-muted);
        border: 1px solid var(--feed-line);
      }
    </style>
  </head>
  <body>
    <div id="feed-status" class="feed-status" role="status" aria-live="polite"></div>
    <div id="feed-xp" class="feed-xp" aria-live="polite">XP: 0</div>
    <div
      id="feed-offline-pill"
      class="feed-offline-pill"
      role="status"
      aria-live="polite"
    >Offline</div>
    <main id="feed" class="feed" aria-label="Latvian listening feed">
      <div class="feed-loader" id="feed-loader">Loading feed</div>
    </main>

    <!-- T-061 install prompt -->
    <div
      id="pwa-install-banner"
      class="pwa-install-banner"
      role="dialog"
      aria-live="polite"
      aria-label="Install the listening app"
      hidden
    >
      <div class="pwa-install-banner__text">
        <strong>Install for offline</strong>
        <span>Save the last 50 clips so you can practise on the bus.</span>
      </div>
      <div class="pwa-install-banner__actions">
        <button id="pwa-install-accept" type="button">Install</button>
        <button id="pwa-install-dismiss" type="button">Not now</button>
      </div>
    </div>

    <script src="feed.js" defer></script>
    <script>
      // T-061 — Service worker registration + install prompt.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/latvian-listening-library/web/sw.js", {
              scope: "/latvian-listening-library/",
            })
            .catch(function (err) {
              if (window.console && console.warn) {
                console.warn("[pwa] listening sw registration failed", err);
              }
            });
        });
      }

      (function installPrompt() {
        var banner = document.getElementById("pwa-install-banner");
        var accept = document.getElementById("pwa-install-accept");
        var dismiss = document.getElementById("pwa-install-dismiss");
        if (!banner || !accept || !dismiss) return;
        var deferred = null;
        var DISMISS_KEY = "pwa_install_dismissed_at_feed";
        var COOLDOWN_MS = 7 * 24 * 60 * 60 * 1000;

        function recentlyDismissed() {
          try {
            var raw = localStorage.getItem(DISMISS_KEY);
            if (!raw) return false;
            var when = parseInt(raw, 10);
            return !isNaN(when) && Date.now() - when < COOLDOWN_MS;
          } catch (e) {
            return false;
          }
        }
        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          deferred = event;
          if (!recentlyDismissed()) banner.hidden = false;
        });
        accept.addEventListener("click", function () {
          if (!deferred) {
            banner.hidden = true;
            return;
          }
          deferred.prompt();
          deferred.userChoice.finally(function () {
            deferred = null;
            banner.hidden = true;
          });
        });
        dismiss.addEventListener("click", function () {
          try {
            localStorage.setItem(DISMISS_KEY, String(Date.now()));
          } catch (e) {
            /* ignore */
          }
          banner.hidden = true;
        });
        var ua = navigator.userAgent || "";
        var isIos = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        var isStandalone =
          window.matchMedia &&
          window.matchMedia("(display-mode: standalone)").matches;
        var isIosStandalone = window.navigator.standalone === true;
        if (isIos && !isStandalone && !isIosStandalone && !recentlyDismissed()) {
          var hint = banner.querySelector(".pwa-install-banner__text span");
          if (hint) {
            hint.textContent =
              'On iPhone: tap Share ↑ then "Add to Home Screen".';
          }
          accept.textContent = "Got it";
          banner.hidden = false;
        }
        window.addEventListener("appinstalled", function () {
          banner.hidden = true;
        });
      })();
    </script>
  </body>
</html>
