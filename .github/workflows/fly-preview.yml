name: Fly.io PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: fly-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy preview app
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PREVIEW_APP="lvcodex-pr-${PR_NUMBER}"
          # Create the app if it doesn't already exist; ignore the error if it does.
          flyctl apps create "$PREVIEW_APP" --org personal 2>/dev/null || true
          flyctl deploy \
            --app "$PREVIEW_APP" \
            --remote-only \
            --wait-timeout 240 \
            --strategy immediate \
            --env "LLM_PROVIDER=groq" \
            --env "LLM_MODEL=llama-3.3-70b-versatile"
          PREVIEW_URL="https://${PREVIEW_APP}.fly.dev"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Comment preview URL on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `🚀 Fly preview deployed: ${url}\n\nThis preview is rebuilt on every push to this PR and torn down when the PR closes.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('🚀 Fly preview deployed'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown-preview:
    name: Tear down preview app
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Destroy preview app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PREVIEW_APP="lvcodex-pr-${PR_NUMBER}"
          flyctl apps destroy "$PREVIEW_APP" --yes 2>/dev/null || echo "preview app already removed"
