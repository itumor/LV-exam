name: Reusable — tests

on:
  workflow_call:
    inputs:
      e2e_grep:
        description: Playwright --grep filter (use "@smoke" for the smoke subset, leave empty to run all E2E tests).
        type: string
        required: false
        default: ""
      full_regression:
        description: When true, run the full regression suite via `npm test`. When false, run unit + contracts + filtered E2E only.
        type: boolean
        required: false
        default: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      E2E_GREP: ${{ inputs.e2e_grep }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full regression suite
        if: ${{ inputs.full_regression }}
        run: npm test

      - name: Run unit + contracts
        if: ${{ !inputs.full_regression }}
        run: |
          npm run test:unit
          npm run test:contracts

      - name: Run E2E subset
        if: ${{ !inputs.full_regression }}
        run: |
          # Playwright exits 1 when --grep matches zero tests. During the
          # bootstrap phase no tests carry the @smoke tag yet, so we treat
          # a clean "no tests found" exit as a pass.
          set +e
          if [ -n "$E2E_GREP" ]; then
            OUTPUT=$(npx playwright test --grep "$E2E_GREP" 2>&1)
            STATUS=$?
          else
            OUTPUT=$(npx playwright test 2>&1)
            STATUS=$?
          fi
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "No tests found"; then
              echo "::notice::Playwright found no tests matching '$E2E_GREP' — treating as pass during bootstrap."
              exit 0
            fi
            exit $STATUS
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
