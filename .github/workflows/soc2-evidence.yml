name: SOC 2 evidence collection

# T-070-final — weekly SOC 2 Type I evidence automation.
#
# Runs the orchestrator in compliance/soc2/automation/orchestrator.py
# every Monday at 04:00 UTC (after the 03:00 backup-restore-drill so
# its result lands in the same week's evidence). Writes per-week JSON
# under compliance/soc2/evidence/<YYYY-WW>/ and opens a PR against
# develop so a human can review before the artifacts merge.
#
# Security:
# * No untrusted github.event.* values are interpolated into run: steps.
#   Only workflow_dispatch inputs are read, and only through env: blocks
#   per https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/.
# * The PR is created from a bot branch with limited permissions.
# * The R2 access keys, if present, are read-only listing creds.
# * gh CLI runs against the same repo it's executing in.

on:
  schedule:
    # Mondays 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      ci_days:
        description: "CI run-history window (days)"
        required: false
        default: "7"
      open_pr:
        description: "Open a PR with the collected evidence"
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: soc2-evidence
  cancel-in-progress: false

jobs:
  collect:
    name: Collect SOC 2 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_VERSION: "3.12"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_DAYS: ${{ github.event.inputs.ci_days || '7' }}
      OPEN_PR: ${{ github.event.inputs.open_pr || 'true' }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify gh CLI
        run: gh --version

      - name: Collect evidence
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_NAME }}
        run: |
          set -euo pipefail
          python -m compliance.soc2.automation.orchestrator \
            --ci-days "${CI_DAYS}" \
            --out-dir compliance/soc2/evidence

      - name: Run SOC 2 pre-flight gate
        run: python scripts/soc2_preflight.py --evidence-root compliance/soc2/evidence

      - name: Compute week tag
        id: week
        run: |
          set -euo pipefail
          tag="$(date -u +'%G-W%V')"
          {
            echo "tag=${tag}"
            echo "branch=chore/soc2-evidence-${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR with new evidence
        if: env.OPEN_PR == 'true'
        env:
          WEEK_TAG: ${{ steps.week.outputs.tag }}
          BRANCH_NAME: ${{ steps.week.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain compliance/soc2/evidence)" ]]; then
            echo "No new evidence to commit."
            exit 0
          fi
          git config user.name  'soc2-evidence-bot'
          git config user.email 'soc2-evidence-bot@users.noreply.github.com'
          git checkout -b "${BRANCH_NAME}"
          git add compliance/soc2/evidence
          git commit -m "chore(soc2): weekly evidence snapshot ${WEEK_TAG}"
          git push --set-upstream origin "${BRANCH_NAME}"
          gh pr create \
            --base develop \
            --head "${BRANCH_NAME}" \
            --title "chore(soc2): weekly evidence snapshot ${WEEK_TAG}" \
            --body "Automated SOC 2 Type I evidence snapshot for ${WEEK_TAG}. Generated by .github/workflows/soc2-evidence.yml. Review the JSON under compliance/soc2/evidence/${WEEK_TAG}/ and merge once the Security Lead has signed off."

      - name: Upload evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: soc2-evidence-${{ steps.week.outputs.tag }}
          path: compliance/soc2/evidence/
          retention-days: 90
