name: CI — Pull request

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/reusable-security.yml

  tests:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      e2e_grep: "@smoke"
      full_regression: false
