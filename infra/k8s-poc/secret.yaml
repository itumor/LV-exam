# T-072 — reference-only PoC. Not applied to any cluster.
#
# This is a STUB. Real values must NEVER be committed. In production
# we'd source these via:
#   * External Secrets Operator (AWS Secrets Manager / GCP Secret Manager)
#   * SealedSecrets (Bitnami)
#   * SOPS-encrypted YAML in git
#
# The keys below mirror the secrets set today via `fly secrets set`. See
# docs/postgres-migration.md, billing.py, and audio_uploads.py for the
# canonical list.
apiVersion: v1
kind: Secret
metadata:
  name: lvcodex-secrets
  namespace: lvcodex
  labels:
    app.kubernetes.io/name: lvcodex
    app.kubernetes.io/component: web
type: Opaque
stringData:
  # Postgres — primary connection string. Replica DSN only set when
  # LVCODEX_MULTI_REGION=1 and the pod runs in a non-primary region.
  DATABASE_URL: "REPLACE_ME"
  DATABASE_REPLICA_URL: "REPLACE_ME"
  # Auth signing
  AUTH_JWT_SECRET: "REPLACE_ME"
  AUTH_PEPPER: "REPLACE_ME"
  # Stripe
  STRIPE_API_KEY: "REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"
  # LLM providers
  GROQ_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  # Email
  POSTMARK_API_KEY: "REPLACE_ME"
  # Cloudflare R2 (backups)
  R2_ACCESS_KEY_ID: "REPLACE_ME"
  R2_SECRET_ACCESS_KEY: "REPLACE_ME"
  R2_BUCKET: "lvcodex-backups"
  R2_ENDPOINT: "https://REPLACE_ME.r2.cloudflarestorage.com"
