# T-072 — reference-only PoC. Not applied to any cluster.
#
# Deployment that maps the current Fly machine topology (1× LHR + 1× FRA
# warm standby, see fly.multi-region.toml) to a single-region K8s
# Deployment with 2 replicas. The HPA in hpa.yaml expands this to 8.
#
# Image: ghcr.io/itumor/lvcodex:latest — we'd publish the existing
# Dockerfile to GHCR as part of the migration. The Dockerfile already
# uses python:3.13-alpine and listens on $PORT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lvcodex-web
  namespace: lvcodex
  labels:
    app.kubernetes.io/name: lvcodex
    app.kubernetes.io/component: web
  annotations:
    # If using Reloader, restart on configmap/secret changes:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lvcodex
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lvcodex
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/itumor/lvcodex:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lvcodex-config
            - secretRef:
                name: lvcodex-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12  # up to 60 s for cold start
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lvcodex-data
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: lvcodex
              app.kubernetes.io/component: web
