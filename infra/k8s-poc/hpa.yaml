# T-072 — reference-only PoC. Not applied to any cluster.
#
# Scale 2 → 8 replicas on CPU or memory pressure. The numbers are
# calibrated against the workload profile in docs/k8s-evaluation.md §2.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lvcodex-web
  namespace: lvcodex
  labels:
    app.kubernetes.io/name: lvcodex
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lvcodex-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
