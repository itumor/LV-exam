app = 'latvian-a2-exam'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '80'
  APP_ENV = 'production'
  AUTH_DB_PATH = '/app/data/auth.sqlite3'
  BILLING_DB_PATH = '/app/data/billing.sqlite3'
  # T-021 Postgres migration toggles. Defaults below keep production on
  # SQLite. To start the cutover, attach a Fly Postgres cluster and set
  # these via `fly secrets set` (see docs/postgres-migration.md):
  #   fly secrets set DATABASE_URL='postgres://…' LVCODEX_DB_DUAL_WRITE=1
  # Then, after backfill + verification:
  #   fly secrets set LVCODEX_DB_READ_FROM=postgres
  # DATABASE_URL is intentionally unset here — it must be a secret.
  LVCODEX_DB_DUAL_WRITE = '0'
  LVCODEX_DB_READ_FROM = 'sqlite'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
