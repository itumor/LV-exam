<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom Lesson — Latvian A2</title>
  <meta
    name="description"
    content="AI-generated micro-lesson personalised to your weakest A2 skill, seeded with the words in your SRS deck."
  />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .lvcodex-lesson-shell {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .lvcodex-lesson-shell h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
    .lvcodex-lesson-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
      margin: 1rem 0 1.5rem;
    }
    .lvcodex-lesson-controls label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #57606a;
      gap: 0.25rem;
    }
    .lvcodex-lesson-controls select,
    .lvcodex-lesson-controls button {
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 1px solid #d0d7de;
      background: #fff;
    }
    .lvcodex-lesson-controls button {
      background: #0969da;
      color: #ffffff;
      border-color: #0969da;
      cursor: pointer;
      font-weight: 600;
    }
    .lvcodex-lesson-controls button:hover { background: #0550ae; }
    .lvcodex-lesson-controls button[disabled] { opacity: 0.6; cursor: not-allowed; }
    .lvcodex-lesson-status { margin: 0.5rem 0; color: #57606a; font-size: 0.95rem; }
    .lvcodex-lesson-status.is-error { color: #cf222e; }
    .lvcodex-lesson-card {
      border: 1px solid #d0d7de;
      border-radius: 12px;
      background: #ffffff;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .lvcodex-lesson-card h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
    .lvcodex-lesson-card .objective { color: #4a5764; margin-bottom: 1rem; }
    .lvcodex-lesson-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #57606a;
      margin-bottom: 1rem;
    }
    .lvcodex-lesson-meta .pill {
      background: #ddf4ff;
      color: #0550ae;
      border-radius: 12px;
      padding: 0.15rem 0.6rem;
      font-weight: 600;
    }
    .lvcodex-lesson-meta .pill.is-cached { background: #fff8c5; color: #7d4e00; }
    .lvcodex-lesson-card h3 { margin: 1rem 0 0.4rem; font-size: 1rem; }
    .lvcodex-lesson-card .vocab-list { padding-left: 1.25rem; }
    .lvcodex-lesson-card .vocab-list li { margin: 0.15rem 0; }
    .lvcodex-lesson-card .drill {
      border-top: 1px solid #eaeef2;
      padding: 0.8rem 0;
    }
    .lvcodex-lesson-card .drill:first-of-type { border-top: 0; }
    .lvcodex-lesson-card .drill .prompt-lv { font-weight: 600; }
    .lvcodex-lesson-card .drill .prompt-en { color: #57606a; font-size: 0.9rem; }
    .lvcodex-lesson-card .drill .answer {
      background: #f6f8fa;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-top: 0.4rem;
      display: none;
    }
    .lvcodex-lesson-card .drill.is-revealed .answer { display: block; }
    .lvcodex-lesson-card .drill button {
      margin-top: 0.4rem;
      background: transparent;
      border: 1px solid #0969da;
      color: #0969da;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lvcodex-lesson-card .drill button:hover { background: #ddf4ff; }
    .lvcodex-lesson-card .reflection {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #f6f8fa;
      border-left: 3px solid #0969da;
      color: #4a5764;
      font-style: italic;
    }
    .lvcodex-lesson-back {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #0969da;
      text-decoration: none;
    }
    .lvcodex-lesson-back:hover { text-decoration: underline; }
    .lvcodex-lesson-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: #57606a;
    }
  </style>
</head>
<body>
  <main class="lvcodex-lesson-shell" id="curriculum-app">
    <header>
      <h1>Custom lesson</h1>
      <p class="lvcodex-lesson-status" id="lesson-status">
        Pick a skill below and generate a lesson personalised to your SRS deck.
      </p>
    </header>

    <section class="lvcodex-lesson-controls" aria-label="Lesson generator controls">
      <label>
        <span>Weak skill</span>
        <select id="weak-skill-select">
          <option value="">Auto-detect (lowest score)</option>
          <option value="listening">Listening</option>
          <option value="reading">Reading</option>
          <option value="writing">Writing</option>
          <option value="speaking">Speaking</option>
        </select>
      </label>
      <button type="button" id="generate-btn">Generate lesson</button>
      <button type="button" id="refresh-btn" title="Force a fresh lesson, bypassing the cache">Refresh (skip cache)</button>
    </section>

    <section id="lesson-output" aria-live="polite"></section>

    <section id="lesson-history-section">
      <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Recent lessons</h2>
      <div id="lesson-history" class="lvcodex-lesson-empty">No lessons yet.</div>
    </section>

    <a class="lvcodex-lesson-back" href="./index.html">&larr; Back to exam app</a>
  </main>

  <script src="./curriculum.js" defer></script>
</body>
</html>
